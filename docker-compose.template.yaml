services:
  auth-backend:
    build: .
    container_name: auth-backend
    restart: always
    ports:
      - "4100:4100"
    environment:
      - DB_CONNECTION=postgresql://<username>:<password>@<host>:5432/<database>
      - SMTP_HOST=
      - SMTP_PORT=
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:15-bookworm
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
      - POSTGRES_DB=auth-
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U <username> -d <database>"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

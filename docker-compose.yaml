services:
  auth-backend:
    build: .
    container_name: auth-backend
    restart: always
    ports:
      - "4100:4100"
    environment:
      - DB_CONNECTION=postgresql://postgres:sciadmin88@database:5432/auth-db
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:15-bookworm
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=sciadmin88
      - POSTGRES_DB=auth-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth-db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
